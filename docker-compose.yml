name: synthx

# BuildKit must be enabled for --mount=type=cache in Dockerfiles.
# Docker Desktop has it on by default; for plain Docker set:
#   DOCKER_BUILDKIT=1 docker-compose up --build

x-build-defaults: &build-defaults
  args:
    BUILDKIT_INLINE_CACHE: "1"

services:

  # ─── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - synthx_backend:latest
    container_name: synthx_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Override SQLite with postgres when using Docker
      DATABASE_URL: postgresql+psycopg2://synthx:synthx@db:5432/synthx
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      STORAGE_LOCAL_DIR: /app/data/documents
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Worker (arq pipeline executor) ─────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - synthx_backend:latest
    container_name: synthx_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://synthx:synthx@db:5432/synthx
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      STORAGE_LOCAL_DIR: /app/data/documents
    volumes:
      - backend_data:/app/data
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend (React + nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - synthx_frontend:latest
    container_name: synthx_frontend
    restart: unless-stopped
    ports:
      - "5001:80"
    depends_on:
      - backend

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: synthx_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: synthx
      POSTGRES_PASSWORD: synthx
      POSTGRES_DB: synthx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthx -d synthx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: synthx_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ChromaDB (vector store) ──────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: synthx_chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"

volumes:
  postgres_data:
  redis_data:
  backend_data:
  chroma_data:
